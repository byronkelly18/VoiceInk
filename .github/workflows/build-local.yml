name: Build VoiceInk (local/free)

on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: xcode-27-xlarge
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Show toolchain versions
        run: |
          xcodebuild -version
          swift --version
          sysctl -n hw.memsize hw.ncpu

      - name: make local
        env:
          # Cap parallel compile jobs to avoid OOM on heavy targets
          # (mlx-swift, LLMkit, swift-crypto) built with -O -whole-module-optimization.
          IDEBuildOperationMaxNumberOfConcurrentCompileTasks: "3"
        run: make local

      - name: Zip built app
        run: |
          cd "$HOME/Downloads"
          ditto -c -k --sequesterRsrc --keepParent VoiceInk.app VoiceInk.app.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoiceInk-app
          path: ~/Downloads/VoiceInk.app.zip
          retention-days: 14
